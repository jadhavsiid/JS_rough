<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        width: 100%;
        height: 100vh;
        background-color: #403d39;
        color: white;
    }
    h1,h2{
        text-align: center;
    }
    h1{
        margin-top: 3rem;
    }
    .color-container{
        display: flex;
        justify-content: space-evenly;
        margin: 4rem;
        padding: 3rem;
    }
    .color-container span{
        width: 10rem;
        height: 10rem;
        margin-top: 3rem;
        border: 2px solid white;
    }
    .color-container span:hover{
        cursor: pointer;
    }
</style>
<body>
    <h1>Color Scheme Switcher</h1>
    <br>
    <h2>Click on one of the below color to change color of the background</h3>
    
    <div class="color-container">
        <span id="tomato-red" class="ef233c" style="background-color: #ef233c"></span>
        <span id="royal-blue" class="2ec4b6" style="background-color: #2ec4b6;"></span>
        <span id="clingy-orange" class="ff7d00" style="background-color: #ff7d00;"></span>
        <span id="naughty-yellow" class="ffd100" style="background-color: #ffd100;"></span>
    </div>
</body>
<script>
    const body = document.querySelector('body')
    const spanTags = document.querySelectorAll('span')

    spanTags.forEach((spanElem)=>{
        spanElem.addEventListener('click',()=>{
            body.style.backgroundColor = '#' + spanElem.getAttribute('class')
        })
    })
</script>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <script
      src="https://kit.fontawesome.com/ee2093fa90.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap");
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Open Sans", sans-serif;
    }
    body {
      width: 100%;
      height: 100vh;
      background: #f64c18;
      background: linear-gradient(179deg, #f64c18 0%, #010101 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      background-repeat: no-repeat;
   
    }
    .container {
      background-color: white;
      width: 30rem;
      height: 28rem;
      border: none;
      border-radius: 10px;
      padding: 30px 35px;
    }
    h1 {
      text-align: center;
      color: #000000;
      font-size: 1.8rem;
    }
    h1 span {
      font-weight: normal;
    }
    .divider {
      border: none;
      border-top: 1px solid #e8e8e8;
      margin: 20px 0;
    }
    .measurements-cont {
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 1.2rem;
    }
    .measurements-cont h4 {
      font-weight: normal;
      font-weight: bold;
    }
    .measurements-cont h4 span {
      font-size: 0.9rem;
    }
    .measurements-cont input {
      width: 8rem;
      height: 2.5rem;
      background-color: #f2f2f2;
      border: 1px solid #e6e6e6;
      display: inline-flex;
      justify-content: center;
      align-items: baseline;
      padding: 14px 22px;
      font-size: 1.2rem;
    }
    .result {
      display: none;
    }
    .result-section {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #e6e6e6;
      width: 100%;
      height: 5rem;
    }
    .features {
      display: flex;
      justify-content: space-evenly;
    }
    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 2rem;
      justify-content: space-evenly;
    }
    .feature i {
      font-size: 2rem;
    }
    #secure,
    #fast {
      border-right: 1px solid #e8e8e8;
    }
    .calculate-button {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }
    .btn {
      padding: 0.8rem 8rem;
      font-size: 1.4rem;
      border: none;
      border-radius: 10px;
      background: #f64c18;
      background: linear-gradient(
        108deg,
        #f64c18 0%,
        #e62314 100%
      );
      font-weight: bold;
      color: #ffffff;
    }
    .btn:hover{
      cursor: pointer;
    }
  </style>
  <body>
    <div class="container">
      <h1>
        Smart BMI <span>Calculator</span>
        <i class="fa-solid fa-brain" style="color: #000000"></i>
      </h1>
      <hr class="divider" />
      <div class="measurements-cont">
        <h4>Height <span>(cm)</span></h4>
        <input type="text" name="height" id="height" />
      </div>
      <hr class="divider" />
      <div class="measurements-cont">
        <h4>Weight <span>(kg)</span></h4>
        <input type="text" name="weight" id="weight" />
      </div>
      <hr class="divider" />
      <div class="result">
        <div class="result-section"></div>
        <hr class="divider" />
      </div>
      <div class="features">
        <div id="secure" class="feature">
          <i class="fa-solid fa-shield-heart" style="color:#000000"></i>
          <p>Secure</p>
        </div>
        <div id="fast" class="feature">
          <i class="fa-solid fa-bolt" style="color: #000000"></i>
          <p>Fast</p>
        </div>
        <div id="accurate" class="feature">
          <i class="fa-solid fa-bullseye" style="color: #000000"></i>
          <p>Accurate</p>
        </div>
      </div>
      <div class="calculate-button">
        <button class="btn">Calculate</button>
      </div>
    </div>
  </body>
</html>

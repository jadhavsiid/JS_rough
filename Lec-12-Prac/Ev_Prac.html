<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="card-parent">
    <div class="card">Bring your mouse here</div>
  </div>
</body>
<script>
  let card= document.querySelector('.card')
  card.addEventListener('mouseover',()=>{
    document.querySelector('.card').innerText = 'Mouse over'
  })
  card.addEventListener('mouseout',()=>{
    document.querySelector('.card').innerText = 'Mouse out'
  })
  document.querySelector('body').addEventListener('keydown',(e)=>{
    if(e.key === 'Enter'){
      alert('You Pressed enter')
    }
  })

  document.querySelector('body').addEventListener('keyup',(e)=>{
    if(e.key === 's'){
      let newElem = document.createElement('h1')
      let newText = document.createTextNode(`You pressed ${e.key}`) 
      let brElem = document.createElement('br')
      newElem.appendChild(newText)
      newElem.appendChild(brElem)
      document.body.appendChild(newElem)

    }
  })
</script>
</html>

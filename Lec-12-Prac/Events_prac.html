<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Prac</title>
</head>
<style>
    button{
        padding: 0.8rem;
       font-size: 1rem;
       border: none;
       border-radius: 20px;
       background-color: black;
       color: white;
    }
    button:hover{
        cursor: pointer;
        font-weight: bold;
    }
</style>
<body>
    <h1 id="demo">Click the button below to generate current date and time</h1>
    <button onclick="displayDate()">Click Me</button>
</body>
<script>
    const displayDate = () =>{
        let headingElement1 = document.getElementById('demo')
        headingElement1.innerText = Date()
    }
</script>
</html>
